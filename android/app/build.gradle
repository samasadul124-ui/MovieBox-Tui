plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.moviebox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.moviebox.app'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '0.1.18-v6'
    }

    // Permanent debug keystore committed in this repo: every build shares ONE
    // signature, so new versions update-install cleanly over old ones.
    // (Sideload/debug key, not a Play release key.)
    signingConfigs {
        debug {
            storeFile file('moviebox-debug.keystore')
            storePassword 'moviebox123'
            keyAlias 'moviebox'
            keyPassword 'moviebox123'
        }
    }

    flavorDimensions "player"
    productFlavors {
        nativePlayer {
            dimension 'player'
            resValue 'string', 'app_name', 'MovieBox'
        }
        vlc {
            dimension 'player'
            applicationIdSuffix '.vlc'
            versionNameSuffix '-vlc'
            resValue 'string', 'app_name', 'MovieBox VLC'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
}
